
<style>
  #gameCanvas { display: block; border-radius: 12px; cursor: none; background: transparent; }
  #gameWrap { position: relative; width: 100%; max-width: 680px; margin: 0 auto; user-select: none; }
  #ui { display: flex; justify-content: space-between; align-items: center; padding: 8px 4px; font-family: var(--font-sans); }
  #score-display { font-size: 18px; font-weight: 500; color: var(--color-text-primary); }
  #lives-display { font-size: 18px; }
  #overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(10,30,80,0.82); border-radius: 12px; font-family: var(--font-sans); color: #fff; }
  #overlay h2 { font-size: 26px; font-weight: 500; margin: 0 0 8px; }
  #overlay p { font-size: 14px; margin: 4px 0; opacity: 0.85; }
  #startBtn { margin-top: 20px; padding: 10px 28px; border-radius: 8px; border: 1.5px solid rgba(255,255,255,0.5); background: rgba(255,255,255,0.12); color: #fff; font-size: 15px; cursor: pointer; font-family: var(--font-sans); transition: background 0.15s; }
  #startBtn:hover { background: rgba(255,255,255,0.22); }
  #finalScore { font-size: 20px; font-weight: 500; margin: 10px 0 0; }
</style>

<div id="gameWrap">
  <div id="ui">
    <div id="score-display">⭐ Points: <span id="pts">0</span></div>
    <div id="lives-display" id="lives">❤️❤️❤️</div>
  </div>
  <canvas id="gameCanvas" width="680" height="420"></canvas>
  <div id="overlay">
    <div style="font-size:48px;margin-bottom:8px;">🧜‍♀️</div>
    <h2>Mermaid Splash!</h2>
    <p>Move your mouse to swim. Collect ✨ gems & 🐠 fish for points.</p>
    <p>Dodge 🦈 sharks and 🪼 jellyfish!</p>
    <button id="startBtn">Start Swimming</button>
    <div id="finalScore" style="display:none;"></div>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const ptsEl = document.getElementById('pts');
const livesEl = document.getElementById('lives-display');

const W = 680, H = 420;
let running = false, score = 0, lives = 3, frame = 0, mouseX = W/2, mouseY = H/2;
let mX = W/2, mY = H/2;
let enemies = [], collectibles = [], bubbles = [], particles = [];
let invincible = 0, speed = 2.5;

canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouseX = e.clientX - r.left;
  mouseY = e.clientY - r.top;
});
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  mouseX = e.touches[0].clientX - r.left;
  mouseY = e.touches[0].clientY - r.top;
}, {passive: false});

startBtn.addEventListener('click', startGame);

function startGame() {
  score = 0; lives = 3; frame = 0; enemies = []; collectibles = []; bubbles = []; particles = [];
  mX = W/2; mY = H/2; mouseX = W/2; mouseY = H/2;
  speed = 2.5; invincible = 0;
  overlay.style.display = 'none';
  document.getElementById('finalScore').style.display = 'none';
  running = true;
  updateUI();
  loop();
}

function updateUI() {
  ptsEl.textContent = score;
  livesEl.textContent = '❤️'.repeat(Math.max(0,lives));
}

function spawnEnemy() {
  const types = ['shark','jelly'];
  const t = Math.random() < 0.6 ? 'shark' : 'jelly';
  const side = Math.floor(Math.random()*3);
  let x,y,vx,vy;
  const sp = 1.2 + Math.min(frame/1200, 2);
  if (side === 0) { x = W+40; y = 60+Math.random()*(H-120); vx = -sp; vy = (Math.random()-0.5)*1.2; }
  else if (side === 1) { x = -40; y = 60+Math.random()*(H-120); vx = sp; vy = (Math.random()-0.5)*1.2; }
  else { x = 60+Math.random()*(W-120); y = -40; vx = (Math.random()-0.5)*1.2; vy = sp; }
  enemies.push({x,y,vx,vy,type:t,r: t==='shark'?22:16, wave:Math.random()*Math.PI*2});
}

function spawnCollectible() {
  const types = ['gem','fish','starfish'];
  const w = Math.random();
  const t = w < 0.4 ? 'gem' : w < 0.75 ? 'fish' : 'starfish';
  const x = 60 + Math.random()*(W-120);
  const y = 50 + Math.random()*(H-100);
  const pts = t==='gem' ? 15 : t==='fish' ? 10 : 25;
  collectibles.push({x,y,r:14,type:t,pts,bob:Math.random()*Math.PI*2,life:400+Math.random()*200});
}

function spawnBubble() {
  bubbles.push({x: 30+Math.random()*(W-60), y: H+10, r: 2+Math.random()*5, speed: 0.4+Math.random()*0.8, wobble: Math.random()*Math.PI*2, alpha: 0.3+Math.random()*0.3});
}

function drawOceanBg() {
  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, '#0d6ea4');
  grad.addColorStop(0.5, '#0a4f82');
  grad.addColorStop(1, '#062f56');
  ctx.fillStyle = grad;
  ctx.roundRect(0,0,W,H,12);
  ctx.fill();

  // light rays
  ctx.save();
  for (let i=0;i<5;i++) {
    const x = 80 + i*130 + Math.sin(frame/80+i)*20;
    const grad2 = ctx.createLinearGradient(x,0,x+40,H);
    grad2.addColorStop(0, 'rgba(180,230,255,0.07)');
    grad2.addColorStop(1, 'rgba(180,230,255,0)');
    ctx.fillStyle = grad2;
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x+50,H); ctx.lineTo(x+20,H); ctx.lineTo(x-10,0); ctx.fill();
  }
  ctx.restore();

  // sand
  ctx.fillStyle = '#b89a6a';
  ctx.fillRect(0, H-30, W, 30);
  ctx.fillStyle = '#cbb07e';
  for (let i=0;i<15;i++) {
    ctx.beginPath();
    ctx.ellipse(30+i*46, H-24, 18, 6, 0, 0, Math.PI*2);
    ctx.fill();
  }

  // coral
  drawCoral(60, H-30, '#e05a5a', 3);
  drawCoral(200, H-30, '#f07050', 2);
  drawCoral(450, H-30, '#d04080', 3);
  drawCoral(600, H-30, '#e06040', 2);
  drawSeaweed(140, H-30);
  drawSeaweed(370, H-30);
  drawSeaweed(530, H-30);
}

function drawCoral(x,y,color,branches) {
  ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (let b=0;b<branches;b++) {
    const angle = -Math.PI/2 + (b-(branches-1)/2)*0.5;
    ctx.beginPath(); ctx.moveTo(x,y);
    const ex = x + Math.cos(angle)*22; const ey = y + Math.sin(angle)*22;
    ctx.lineTo(ex,ey);
    ctx.stroke();
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(ex,ey,4,0,Math.PI*2); ctx.fill();
  }
}

function drawSeaweed(x,y) {
  ctx.strokeStyle = '#2d8a45'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x,y);
  for (let i=1;i<=5;i++) {
    ctx.quadraticCurveTo(x+Math.sin(frame/30+i)*12, y-i*8, x+Math.sin(frame/30+i+1)*8, y-i*8-4);
  }
  ctx.stroke();
}

function drawBubbles() {
  ctx.save();
  for (const b of bubbles) {
    b.y -= b.speed; b.wobble += 0.03;
    b.x += Math.sin(b.wobble)*0.4;
    ctx.strokeStyle = `rgba(180,230,255,${b.alpha})`;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.stroke();
  }
  ctx.restore();
  bubbles = bubbles.filter(b => b.y > -20);
}

function drawMermaid(x, y, inv) {
  if (inv > 0 && Math.floor(frame/4)%2===0) return;
  const t = frame/20;
  
  // tail fin
  ctx.save();
  ctx.translate(x, y+12);
  ctx.rotate(Math.sin(t)*0.3);
  ctx.fillStyle = '#1dcfb0';
  ctx.beginPath();
  ctx.moveTo(0,0);
  ctx.bezierCurveTo(-18, 8, -22, 18, -14, 22);
  ctx.bezierCurveTo(-5, 28, 5, 28, 14, 22);
  ctx.bezierCurveTo(22, 18, 18, 8, 0, 0);
  ctx.fill();
  ctx.fillStyle = '#15a890';
  ctx.beginPath();
  ctx.moveTo(-14,22); ctx.bezierCurveTo(-20,30,-24,35,-16,38);
  ctx.bezierCurveTo(-8,42,0,40,0,36);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(14,22); ctx.bezierCurveTo(20,30,24,35,16,38);
  ctx.bezierCurveTo(8,42,0,40,0,36);
  ctx.fill();
  ctx.restore();

  // scale shimmer
  ctx.save();
  ctx.translate(x,y+4);
  ctx.rotate(Math.sin(t)*0.15);
  ctx.fillStyle = '#10b89e';
  ctx.beginPath(); ctx.ellipse(0, 8, 8, 13, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // body
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(Math.sin(t)*0.1);
  ctx.fillStyle = '#ffe0c8';
  ctx.beginPath(); ctx.ellipse(0, -2, 9, 13, 0, 0, Math.PI*2); ctx.fill();
  
  // top/shell bra
  ctx.fillStyle = '#e85fa0';
  ctx.beginPath(); ctx.ellipse(-5, 3, 5, 4, -0.3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(5, 3, 5, 4, 0.3, 0, Math.PI*2); ctx.fill();

  // arms
  ctx.strokeStyle = '#ffe0c8'; ctx.lineWidth = 4; ctx.lineCap='round';
  const armSwing = Math.sin(t)*12;
  ctx.beginPath(); ctx.moveTo(-9,0); ctx.quadraticCurveTo(-20,-4+armSwing/2,-18, 8+armSwing/4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(9,0); ctx.quadraticCurveTo(20,-4-armSwing/2,18, 8-armSwing/4); ctx.stroke();

  // head
  ctx.fillStyle = '#ffe0c8';
  ctx.beginPath(); ctx.arc(0,-14,10,0,Math.PI*2); ctx.fill();

  // eyes
  ctx.fillStyle = '#2d1a6e';
  ctx.beginPath(); ctx.arc(-4,-14,2.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(4,-14,2.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-3.2,-14.5,1,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(4.8,-14.5,1,0,Math.PI*2); ctx.fill();

  // blush
  ctx.fillStyle = 'rgba(255,130,160,0.45)';
  ctx.beginPath(); ctx.ellipse(-7,-13,3,2,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(7,-13,3,2,0,0,Math.PI*2); ctx.fill();

  // smile
  ctx.strokeStyle = '#c0624a'; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.arc(0,-12,3,0.1,Math.PI-0.1); ctx.stroke();

  // hair
  ctx.fillStyle = '#f0c020';
  ctx.beginPath(); ctx.arc(0,-14,10,Math.PI+0.2,Math.PI*2-0.2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-10,-14);
  ctx.bezierCurveTo(-16,-8,-18,2,-14,10);
  ctx.bezierCurveTo(-12,4,-10,-4,-9,-13);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(10,-14);
  ctx.bezierCurveTo(16,-8,16,2,12,10);
  ctx.bezierCurveTo(10,4,9,-4,9,-13);
  ctx.fill();

  // crown/star accessory
  ctx.fillStyle = '#ffd700';
  ctx.beginPath(); ctx.arc(0,-24,3,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='#ffd700'; ctx.lineWidth=1.5;
  for(let i=0;i<5;i++){
    const a=-Math.PI/2+i*Math.PI*2/5;
    ctx.beginPath(); ctx.moveTo(0,-24); ctx.lineTo(Math.cos(a)*6,-24+Math.sin(a)*6); ctx.stroke();
  }

  ctx.restore();
}

function drawShark(x,y,vx,wave,t) {
  ctx.save();
  ctx.translate(x,y);
  const flip = vx > 0 ? 1 : -1;
  ctx.scale(flip, 1);
  ctx.rotate(Math.sin(wave+t/10)*0.12);

  // body
  ctx.fillStyle = '#5a7fa0';
  ctx.beginPath();
  ctx.moveTo(-28,0);
  ctx.bezierCurveTo(-20,-10,20,-10,28,0);
  ctx.bezierCurveTo(20,8,-20,8,-28,0);
  ctx.fill();

  // tail
  ctx.fillStyle = '#4a6a8a';
  ctx.beginPath(); ctx.moveTo(-24,0); ctx.lineTo(-38,-10); ctx.lineTo(-34,0); ctx.lineTo(-38,10); ctx.closePath(); ctx.fill();

  // dorsal fin
  ctx.fillStyle = '#4a6a8a';
  ctx.beginPath(); ctx.moveTo(-5,-10); ctx.lineTo(2,-22); ctx.lineTo(10,-10); ctx.closePath(); ctx.fill();

  // belly
  ctx.fillStyle = '#d0e0ee';
  ctx.beginPath(); ctx.ellipse(0,5,16,5,0,0,Math.PI*2); ctx.fill();

  // eye
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(20,-1,3,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(21,-2,1,0,Math.PI*2); ctx.fill();

  // teeth
  ctx.fillStyle = '#fff';
  for (let i=0;i<4;i++) {
    ctx.beginPath();
    ctx.moveTo(14-i*3.5, 5);
    ctx.lineTo(12-i*3.5, 10);
    ctx.lineTo(10-i*3.5, 5);
    ctx.fill();
  }
  ctx.restore();
}

function drawJellyfish(x,y,wave,t) {
  ctx.save();
  ctx.translate(x, y + Math.sin(wave+t/15)*6);
  ctx.fillStyle = 'rgba(200,100,220,0.75)';
  ctx.beginPath(); ctx.arc(0,0,16,Math.PI,0); ctx.fill();
  ctx.fillStyle = 'rgba(220,130,240,0.6)';
  ctx.beginPath(); ctx.arc(0,0,10,Math.PI,0); ctx.fill();

  ctx.strokeStyle = 'rgba(200,100,220,0.55)'; ctx.lineWidth = 1.5; ctx.lineCap='round';
  for (let i=-3;i<=3;i++) {
    const bx = i*4;
    ctx.beginPath(); ctx.moveTo(bx,2);
    ctx.quadraticCurveTo(bx+Math.sin(wave+i+t/10)*8, 14, bx+Math.sin(wave+i+t/8)*6, 22);
    ctx.stroke();
  }
  ctx.restore();
}

function drawCollectible(c, t) {
  const bob = Math.sin(c.bob + t/20)*4;
  ctx.save(); ctx.translate(c.x, c.y+bob);
  if (c.type==='gem') {
    ctx.fillStyle = '#50e8f8';
    ctx.strokeStyle = '#20b8c8'; ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(0,-14); ctx.lineTo(10,-4); ctx.lineTo(0,14); ctx.lineTo(-10,-4); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.5)';
    ctx.beginPath(); ctx.moveTo(0,-14); ctx.lineTo(10,-4); ctx.lineTo(0,-2); ctx.closePath(); ctx.fill();
  } else if (c.type==='fish') {
    ctx.fillStyle = '#ff8c42';
    ctx.beginPath(); ctx.ellipse(0,0,11,7,0,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-11,0); ctx.lineTo(-18,-7); ctx.lineTo(-18,7); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#2d1a6e'; ctx.beginPath(); ctx.arc(9,-1,2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(9.6,-1.5,0.8,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.2)'; ctx.lineWidth=0.8;
    ctx.beginPath(); ctx.arc(0,0,6,Math.PI*0.7,Math.PI*1.3); ctx.stroke();
  } else {
    // starfish
    ctx.fillStyle = '#ff9055';
    for (let i=0;i<5;i++){
      ctx.save(); ctx.rotate(i*Math.PI*2/5);
      ctx.beginPath(); ctx.ellipse(0,-11,4,10,0,0,Math.PI*2); ctx.fill();
      ctx.restore();
    }
    ctx.fillStyle='#ffb070'; ctx.beginPath(); ctx.arc(0,0,6,0,Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawParticles() {
  particles = particles.filter(p => p.life>0);
  for (const p of particles) {
    ctx.save();
    ctx.globalAlpha = p.life/p.maxLife;
    ctx.fillStyle = p.color;
    ctx.font = `${p.size}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(p.text, p.x, p.y);
    p.x += p.vx; p.y += p.vy; p.life--;
    ctx.restore();
  }
}

function addParticle(x, y, text, color) {
  particles.push({x,y,text,color,vx:(Math.random()-0.5)*2,vy:-2-Math.random()*2,life:50,maxLife:50,size:16});
}

function loop() {
  if (!running) return;
  frame++;
  ctx.clearRect(0,0,W,H);
  drawOceanBg();

  // bubbles
  if (frame%18===0) spawnBubble();
  drawBubbles();

  // spawn
  const spawnRate = Math.max(60-Math.floor(frame/200)*5, 25);
  if (frame%spawnRate===0) spawnEnemy();
  if (frame%90===0 || (collectibles.length<3 && frame%30===0)) spawnCollectible();

  // score trickle
  if (frame%60===0) { score++; updateUI(); }

  // move mermaid
  const dx = mouseX-mX, dy = mouseY-mY;
  const dist = Math.sqrt(dx*dx+dy*dy);
  if (dist>2) { mX+=dx*0.10; mY+=dy*0.10; }
  mX = Math.max(20,Math.min(W-20,mX));
  mY = Math.max(20,Math.min(H-45,mY));

  // collectibles
  for (const c of collectibles) {
    c.life--;
    drawCollectible(c, frame);
    const cdx=mX-c.x, cdy=mY-c.y;
    if (Math.sqrt(cdx*cdx+cdy*cdy)<c.r+18) {
      score+=c.pts;
      addParticle(c.x,c.y, '+'+c.pts+'✨', '#ffe04a');
      c.life=-1;
      updateUI();
    }
  }
  collectibles = collectibles.filter(c=>c.life>0);

  // enemies
  if (invincible>0) invincible--;
  for (const e of enemies) {
    e.x+=e.vx; e.y+=e.vy; e.wave+=0.05;
    if (e.type==='shark') drawShark(e.x,e.y,e.vx,e.wave,frame);
    else drawJellyfish(e.x,e.y,e.wave,frame);

    // collision
    if (invincible===0) {
      const ed=Math.sqrt((mX-e.x)**2+(mY-e.y)**2);
      if (ed<e.r+14) {
        lives--;
        invincible=90;
        addParticle(mX,mY,'💥','#ff4444');
        updateUI();
        if (lives<=0) { endGame(); return; }
      }
    }
  }
  enemies = enemies.filter(e=>e.x>-80&&e.x<W+80&&e.y>-80&&e.y<H+80);

  // mermaid
  drawMermaid(mX, mY, invincible);

  // cursor dot
  ctx.fillStyle='rgba(255,255,255,0.4)';
  ctx.beginPath(); ctx.arc(mouseX,mouseY,4,0,Math.PI*2); ctx.fill();

  drawParticles();

  requestAnimationFrame(loop);
}

function endGame() {
  running = false;
  overlay.style.display = 'flex';
  document.querySelector('#overlay h2').textContent = '🌊 Game Over!';
  document.querySelector('#overlay p').textContent = 'The ocean was too dangerous...';
  const fs = document.getElementById('finalScore');
  fs.style.display='block';
  fs.textContent = '⭐ Final score: '+score;
  startBtn.textContent = 'Swim Again';
  startBtn.style.display='block';
}
</script>
